services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8003:8003"
    env_file:
      - ./backend/.env
    environment:
      PROJECT_ROOT: /app
      CHROMA_PATH: /app/chroma_db
      CHROMA_COLLECTION: nui_ba_den_rag
      AUTO_BUILD_CHROMA_ON_STARTUP: "true"
    volumes:
      - chroma_data:/app/chroma_db
      - hf_cache:/root/.cache/huggingface
      - ./backend/app:/app/app:ro
      - ./nui_ba_den_tourism_database.xlsx:/app/nui_ba_den_tourism_database.xlsx:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://backend:8003
    depends_on:
      - backend

volumes:
  chroma_data:
  hf_cache:
